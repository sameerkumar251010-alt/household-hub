.drawer-backdrop{position:fixed;inset:0;background:rgba(15,16,26,.42);z-index:60;display:flex}.drawer{width:min(300px,82%);height:100%;background:var(--card);box-shadow:0 0 40px rgba(0,0,0,.25);overflow:auto;animation:slideIn .22s ease-out;display:flex;flex-direction:column}
@keyframes slideIn{from{transform:translateX(-100%)}to{transform:translateX(0)}}
.drawer-profile{display:flex;align-items:center;gap:13px;padding:24px 18px 16px}.drawer-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--purple2));display:grid;place-items:center;font-size:24px;color:#fff;flex:none}.drawer-profile h3{margin:0;font-size:17px}.drawer-profile span{color:var(--muted);font-size:12px}

.profile-avatar{width:100%;height:100%;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--purple),var(--purple2));display:grid;place-items:center;font-size:42px;color:#fff}
.profile-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.profile-avatar-edit{position:absolute;right:-3px;bottom:-3px;width:32px;height:32px;border-radius:50%;background:var(--purple2);color:#fff;border:3px solid var(--card);display:grid;place-items:center;font-size:14px;box-shadow:0 4px 10px rgba(0,0,0,.18);cursor:pointer}
.drawer-item{display:flex;align-items:center;gap:14px;padding:13px 18px;border:0;background:transparent;width:100%;text-align:left;font-size:14px;color:var(--text);font-weight:600}.drawer-item .drawer-icon{font-size:18px;width:24px;text-align:center}.drawer-item:active{background:var(--bg)}
.drawer-toggle-row{display:flex;align-items:center;justify-content:space-between;padding:13px 18px}.drawer-toggle-row .left{display:flex;align-items:center;gap:14px;font-size:14px;font-weight:600}.drawer-toggle-row .drawer-icon{font-size:18px;width:24px;text-align:center}
.switch{position:relative;width:44px;height:25px;background:#dcdee6;border-radius:999px;border:0;flex:none}.switch.on{background:var(--purple)}.switch::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;background:#fff;border-radius:50%;transition:transform .15s}.switch.on::after{transform:translateX(19px)}

@media(max-width:560px){.app-shell{width:100%;margin:0}.phone{border-radius:0;border-left:0;border-right:0;min-height:100vh}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}.summary{grid-template-columns:1fr}.hero-art{font-size:42px}}

<!-- Household Hub: Firebase connection - Step 1 -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig = {
 apiKey: "AIzaSyD1JRzTQciZ2kLNWu65xNltDRYEeuFMqd0",
 authDomain: "household-hub-7acd9.firebaseapp.com",
 projectId: "household-hub-7acd9",
 storageBucket: "household-hub-7acd9.firebasestorage.app",
 messagingSenderId: "849661773929",
 appId: "1:849661773929:web:65bd6018df172990e3faf8"
};
const firebaseApp = initializeApp(firebaseConfig);
const firestore = getFirestore(firebaseApp);
window.householdHubFirebase = {app: firebaseApp, db: firestore};

<script>
"use strict";

/*
  Household Hub — New User Prototype
  - Starts with zero demo household data.
  - Onboarding: name, group name, group code, optional role.
  - Verification is a local prototype simulation, not real authentication.
  - Other Groups are view-only; no group switching.
*/

const KEY="household_hub_new_prototype_v3_onboarding_fixed";

const state={
  onboarding:{name:"",groupName:"",groupCode:"",role:"Member"},
  household:null,
  works:[],
  bills:[],
  activity:[],
  darkMode:false,
  currentScreen:"home"
};

function load(){
  try{
    const saved=localStorage.getItem(KEY);
    if(saved) Object.assign(state,JSON.parse(saved));
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(state)); }
  catch(e){ console.warn("Could not persist state (storage unavailable):",e); }
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg;t.classList.add("show");
  clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove("show"),1800);
}
function resetApp(){
  localStorage.removeItem(KEY);
  location.reload();
}
function me(){
  return state.household?.members?.find(x=>x.you) || null;
}
function handleAvatarUpload(event){
  const file=event.target.files && event.target.files[0];
  event.target.value="";
  if(!file) return;
  const looksLikeImage=file.type.startsWith("image/") || (!file.type && /\.(jpe?g|png|gif|webp|heic|heif|bmp)$/i.test(file.name||""));
  if(!looksLikeImage){toast("Please choose an image file");return;}
  const reader=new FileReader();
  reader.onload=(e)=>{
    const img=new Image();
    img.onload=()=>{
      const maxSize=320;
      let w=img.width,h=img.height;
      if(w>h){ if(w>maxSize){h=Math.round(h*maxSize/w);w=maxSize;} }
      else { if(h>maxSize){w=Math.round(w*maxSize/h);h=maxSize;} }
      const canvas=document.createElement("canvas");
      canvas.width=w;canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      const dataUrl=canvas.toDataURL("image/jpeg",0.85);
      const mem=me();
      if(mem){
        mem.avatar=dataUrl;
        renderProfile();
        toast("Profile photo updated");
        save();
      }
    };
    img.onerror=()=>toast("Couldn't read that image");
    img.src=e.target.result;
  };
  reader.onerror=()=>toast("Couldn't read that image");
  reader.readAsDataURL(file);
}
function removeAvatar(){
  const mem=me();
  if(mem){ delete mem.avatar; renderProfile(); toast("Profile photo removed"); save(); }
}
function todayKey(){return new Date().toISOString().slice(0,10);}
function startOfWeek(){
  const d=new Date();const day=d.getDay()||7;d.setDate(d.getDate()-day+1);d.setHours(0,0,0,0);return d;
}
function isToday(iso){return iso && iso.slice(0,10)===todayKey();}
function weekXp(){
  const start=startOfWeek();
  return state.activity.filter(a=>a.type==="xp"&&new Date(a.time)>=start).reduce((s,a)=>s+Number(a.amount||0),0);
}
function totalXp(){
  return state.activity.filter(a=>a.type==="xp").reduce((s,a)=>s+Number(a.amount||0),0);
}
function groupTotal(){
  const members=state.household?.members||[];
  return members.reduce((s,m)=>s+Number(m.xp||0),0);
}
function memberRank(){
  const arr=[...(state.household?.members||[])].sort((a,b)=>(b.xp||0)-(a.xp||0));
  const id=me()?.id; return Math.max(1,arr.findIndex(x=>x.id===id)+1);
}
function groupRank(){ return {rank:1,total:1}; }
/* ---------- onboarding: Welcome -> Information -> Create/Join -> Group Code -> Verification ---------- */
function renderOnboarding(){
  document.getElementById("app").innerHTML=`
  <div class="content center">
    <div class="auth-wrap" style="text-align:center">
      <div class="logo">🏠</div>
      <h1 class="auth-title">Household Hub</h1>
      <p class="auth-sub">Organize your household.<br>Work together. Earn XP.</p>
      <button class="primary" style="width:100%" onclick="renderInformation()">Get Started</button>
    </div>
  </div>`;
}

function renderInformation(){
  const o=state.onboarding;
  document.getElementById("app").innerHTML=`
  <div class="content">
    <button class="link" onclick="renderOnboarding()">← Back</button>
    <div class="auth-wrap">
      <h1 class="auth-title" style="font-size:25px">Your Information</h1>
      <p class="auth-sub">Tell us who you are and how you'll participate.</p>
      <div class="form-card">
        <div class="field">
          <label>Name</label>
          <input id="infoName" placeholder="Your name" value="${esc(o.name)}">
        </div>
        <div class="field">
          <label>Choose your role</label>
          <div class="role-choice">
            <button type="button" class="role-btn ${o.role==="Admin"?"selected":""}" id="roleAdminBtn" onclick="selectRole('Admin')">
              👑 Admin
              <span>Assign Work to members, set & change deadlines</span>
            </button>
            <button type="button" class="role-btn ${o.role==="Member"?"selected":""}" id="roleMemberBtn" onclick="selectRole('Member')">
              👤 Member
              <span>Create your own Work, set your deadline, earn XP</span>
            </button>
          </div>
        </div>
        <button class="primary" style="width:100%;margin-top:6px" onclick="saveInformation()">Continue</button>
      </div>
    </div>
  </div>`;
}
function selectRole(role){
  state.onboarding.role=role;
  document.getElementById("roleAdminBtn")?.classList.toggle("selected",role==="Admin");
  document.getElementById("roleMemberBtn")?.classList.toggle("selected",role==="Member");
}
function saveInformation(){
  const name=document.getElementById("infoName")?.value.trim();
  if(!name){toast("Please enter your name");return;}
  state.onboarding.name=name;
  save();
  renderGroupChoice();
}

function renderGroupChoice(){
  document.getElementById("app").innerHTML=`
  <div class="content">

/* ---------- Work ---------- */

function classifyWork(title){
  const t=title.toLowerCase();
  const big=['deep clean','whole house','entire house','full house','wash car','car wash','grocery shopping','buy groceries','repair','maintenance','move furniture','clean all rooms','garden cleaning','major cleaning'];
  const medium=['clean kitchen','clean bathroom','bathroom','kitchen','mop','sweep','dishes','wash dishes','laundry','clothes','dust','clean room','water plants','take out trash','garbage','cook','cooking','meal','bedsheet','bed sheet','balcony','sink','stove','windows'];
  if(big.some(k=>t.includes(k))) return 'Big';
  if(medium.some(k=>t.includes(k))) return 'Medium';
  return 'Small';
}
function xpForSize(size){return size==='Big'?20:size==='Medium'?10:5;}
function workOverdue(w){return !w.done && Number.isFinite(Number(w.dueAt)) && Date.now()>Number(w.dueAt);}
function formatDeadline(w){
  return w.dueAt
    ? new Date(Number(w.dueAt)).toLocaleString([], {dateStyle:'medium',timeStyle:'short'})
    : 'No deadline';
}
function localDateTimeMin(){
  const min=new Date(Date.now()+60000);
  return new Date(min.getTime()-min.getTimezoneOffset()*60000).toISOString().slice(0,16);
}
function isAdmin(){return state.onboarding.role==="Admin";}

          <div class="deadline-lock">${admin?"The deadline must be in the future.":"The deadline must be in the future and will be locked after adding."}</div>
        </div>

            <option value="">One time</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>

  document.getElementById("app").innerHTML=`${topbar("Work","renderHome()")}
  <main class="content">

      <b style="font-size:13px">How deadlines work</b>
      <p class="muted" style="margin:7px 0 0">
        Small = 5 XP · Medium = 10 XP · Big = 20 XP.
        If the deadline is missed, the work becomes <b>INCOMPLETE</b> and earns 0 XP even if finished later.
        ${admin?"As Admin, you can change deadlines on work you create.":"Once you set your deadline, it's locked."}
      </p>
    </div>

    <div class="section-title">Work</div>
    ${works.length?works.map((w,i)=>{
      const overdue=workOverdue(w);
      const status=w.done
        ? (w.late?'<span class="tag red">Completed Late · 0 XP</span>':`<span class="tag green">Completed · +${w.xp} XP</span>`)
        : (overdue?'<span class="tag red">INCOMPLETE</span>':'<span class="tag">Open</span>');
      const canComplete=!w.done && w.assignee===(me()?.name);
      const canEditDeadline=admin && !w.lockedDeadline && !w.done;
      return `<div class="work-item">
        <div class="row">
          <div>
            <b>${esc(w.title)}</b>
            <div class="muted">${esc(w.size)} work · ${w.xp} XP · Assigned to ${esc(w.assignee)===me()?.name?"you":esc(w.assignee)}</div>
            <div class="muted">${w.lockedDeadline?"🔒":""} Deadline: ${esc(formatDeadline(w))}</div>
            ${w.recurring?`<div class="muted">🔁 ${esc(w.recurring)} repeat</div>`:""}
          </div>
          ${status}
        </div>
        <div style="display:flex;gap:8px;margin-top:10px">
          ${canComplete?`<button class="secondary" onclick="completeWork(${i})">Complete Work</button>`:""}
          ${canEditDeadline?`<button class="secondary" onclick="editDeadline(${i})">Change Deadline</button>`:""}
        </div>
      </div>`;
    }).join(""):`<div class="empty" style="margin-top:10px">No work yet. Add the first one.</div>`}

function completeWork(i){
  const w=state.works[i];
  if(!w||w.done)return;
  if(w.assignee!==me()?.name)return; // XP only goes to the person the work is assigned to

  const late=workOverdue(w);
  w.done=true;
  w.completedAt=new Date().toISOString();
  w.late=late;
  w.xp=late?0:xpForSize(w.size);

  const m=me();
  m.completed=(m.completed||0)+1;

  if(!late){
    m.xp=(m.xp||0)+w.xp;

    const last=m.lastWorkDate;
    const today=todayKey();
    if(last!==today){
      if(last){
        const d1=new Date(last+"T00:00:00"),d2=new Date(today+"T00:00:00");
        const diff=Math.round((d2-d1)/86400000);
        m.streak=diff===1?(m.streak||0)+1:1;
      }else{
        m.streak=1;
      }
      m.lastWorkDate=today;
    }

    state.activity.push({
      type:"xp",
      amount:w.xp,
      time:new Date().toISOString(),
      text:`Completed ${w.title} on time`
    });
    toast(`Work completed on time! +${w.xp} XP`);
  }else{
    state.activity.push({
      type:"xp",
      amount:0,
      time:new Date().toISOString(),
      text:`Completed ${w.title} late · 0 XP`
    });
    toast("Deadline missed · 0 XP");
  }

  // Recurring work gets the next future occurrence, never an already-past deadline.
  if(w.recurring){
    const step=w.recurring==="weekly"?7*86400000:86400000;
    let nextDue=Number(w.dueAt)+step;
    while(nextDue<=Date.now()) nextDue+=step;
    state.works.push({
      ...w,
      id:crypto.randomUUID?.()||String(Date.now()+Math.random()),
      done:false,
      completedAt:null,
      late:false,
      xp:xpForSize(w.size),
      dueAt:nextDue,
      created:new Date().toISOString()
    });
  }

  save();
  renderWork();
}

      <div class="modal">
        <div class="modal-head">
          <div><h2 style="margin:0">💳 Add Bill</h2></div>
          <button class="close" onclick="closeAddBill()">×</button>
        </div>
        <div class="field" style="margin-top:18px">
          <label>Bill name</label>
          <input id="billTitle" placeholder="e.g. Electricity">
        </div>
        <div class="field">
          <label>Amount (₹)</label>
          <input id="billAmount" type="number" min="0" placeholder="e.g. 1500">
        </div>
        <div class="field">
          <label>Due date</label>
          <input id="billDue" type="date">
        </div>
        <button class="primary" onclick="saveNewBill()">Add Bill</button>
      </div>
    </div>
  `);
}
function closeAddBill(){document.getElementById("addBillModal")?.remove();}
function saveNewBill(){
  const title=document.getElementById("billTitle")?.value.trim();
  const amount=document.getElementById("billAmount")?.value;
  const due=document.getElementById("billDue")?.value;
  if(!title){toast("Please enter a bill name");return;}
  if(amount===""||amount===undefined||Number(amount)<0){toast("Please enter a valid amount");return;}
  state.bills.unshift({title,amount:Number(amount),due:due||"",paid:false,createdAt:new Date().toISOString()});
  save();
  closeAddBill();
  toast("Bill added");
  renderBills();
}
function payBill(i){if(!state.bills[i])return;state.bills[i].paid=true;save();toast("Bill marked as paid");renderBills();}

/* ---------- Progress ---------- */
function renderProgress(){
  const m=me(),xp=m.xp||0,level=Math.floor(xp/100)+1,inside=xp%100,pct=inside,weekly=weekXp();
  document.getElementById("app").innerHTML=`${topbar("My Progress","renderHome()")}
  <main class="content"><button class="link" onclick="renderHome()">← Back to Home</button><h1 class="page-title" style="margin-top:10px">My Progress</h1><p class="page-sub">Your personal progress inside ${esc(state.household.groupName)}.</p>
  <div class="card"><div class="row"><div><div class="muted">CURRENT LEVEL</div><h2 style="margin:4px 0">⭐ Level ${level}</h2></div><b>${inside}/100 XP</b></div><div class="bar"><span style="width:${pct}%"></span></div><div class="muted" style="margin-top:8px">${100-inside} XP to Level ${level+1}</div></div>
  <div class="stats" style="margin-top:13px"><div class="stat"><div class="stat-icon">⭐</div><small>Total XP</small><strong>${xp}</strong></div><div class="stat"><div class="stat-icon">📅</div><small>This Week</small><strong>${weekly}</strong></div><div class="stat"><div class="stat-icon">🔥</div><small>Streak</small><strong>${m.streak||0}</strong></div><div class="stat"><div class="stat-icon">🎯</div><small>Completed</small><strong>${m.completed||0}</strong></div></div>
  <div class="section-title">Milestones</div>
  <div class="tool-row">
    <div class="tool"><div class="big">🌟</div><b>First Work</b><span>${(m.completed||0)>=1?"Unlocked":"Complete your first work"}</span></div>
    <div class="tool"><div class="big">💯</div><b>100 XP</b><span>${xp>=100?"Unlocked":"Earn "+(100-xp)+" more XP"}</span></div>
    <div class="tool"><div class="big">🔥</div><b>7-Day Streak</b><span>${(m.streak||0)>=7?"Unlocked":"Keep working daily"}</span></div>
    <div class="tool"><div class="big">👑</div><b>500 XP</b><span>${xp>=500?"Unlocked":"Earn "+(500-xp)+" more XP"}</span></div>
  </div>
  <div class="card"><div class="cardhead"><h3>🏆 Group Standing</h3><button class="link" onclick="renderMyGroup()">View group</button></div><div class="row"><span>Your member rank</span><b>#${memberRank()}</b></div><div class="row" style="margin-top:9px"><span>Group rank</span><b>#${groupRank().rank} / ${groupRank().total}</b></div></div>
  </main>${bottomNav("progress")}`;
}
/* ---------- History: real XP/work events, newest first ---------- */
function renderHistory(){
  const events=[...state.activity].filter(a=>a.type==="xp").sort((a,b)=>new Date(b.time)-new Date(a.time));
  document.getElementById("app").innerHTML=`${topbar("History","renderHome()")}
  <main class="content"><button class="link" onclick="renderHome()">← Back to Home</button>
  <h1 class="page-title" style="margin-top:10px">📜 History</h1>
  <p class="page-sub">A record of every completed, late, or missed Work event.</p>
  ${events.length?`<div class="card">${events.map(e=>{
    const positive=Number(e.amount)>0;
    const d=new Date(e.time);
    const dateStr=d.toLocaleDateString([], {day:"2-digit",month:"short",year:"numeric"});
    const timeStr=d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    return `<div class="history-item">
      <div class="history-body">
        <b>${esc(e.text)}</b>
        <span class="muted">${dateStr} · ${timeStr}</span>
      </div>
      <b class="${positive?"xp-pos":"xp-zero"}">${positive?"+":""}${e.amount} XP</b>
    </div>`;
  }).join("")}</div>`:`<div class="empty" style="margin-top:10px">No history yet. Complete some Work to see events here.</div>`}
  </main>`;
}
/* ---------- Global Leaderboard: real groups ranked by total XP, no fake households ---------- */
function renderGlobalLeaderboard(){
  // Only real households known to this device are shown — never invented ones.
  const groups=[{name:state.household.groupName,xp:groupTotal(),you:true}]
    .sort((a,b)=>b.xp-a.xp);
  document.getElementById("app").innerHTML=`${topbar("Leaderboard","renderMyGroup()")}
  <main class="content"><button class="link" onclick="renderMyGroup()">← Back to My Group</button>
  <h1 class="page-title" style="margin-top:10px">🌍 Global Leaderboard</h1>
  <p class="page-sub">Real households ranked by total XP.</p>
  <div class="card">${groups.map((g,i)=>`<div class="member ${g.you?"you":""}"><b>${i+1}</b><div style="display:flex;align-items:center;gap:8px"><i class="avatar">${g.you?"🏠":"👥"}</i><span>${esc(g.name)}${g.you?" (Your Group)":""}</span></div><b>${g.xp} XP</b></div>`).join("")}</div>
  <div class="lock-note">🌐 Your household is the only one on this device right now. Once Household Hub has a shared backend, every real household that opts in will appear here ranked by total XP — no invented data.</div>
  </main>`;
}

/* ---------- My Group: the user's real household only, no switching ---------- */
function renderMyGroup(){
  const members=[...(state.household.members||[])].sort((a,b)=>(b.xp||0)-(a.xp||0));
  document.getElementById("app").innerHTML=`${topbar("My Group","renderHome()")}
  <main class="content"><button class="link" onclick="renderHome()">← Back to Home</button>
  <h1 class="page-title" style="margin-top:10px">🏠 My Group</h1><p class="page-sub">Your household group and its members.</p>
  <div class="card"><div class="row"><div><h1 class="page-title" style="font-size:21px">${esc(state.household.groupName)}</h1><div class="muted">Group code: ${esc(state.household.groupCode)}</div></div><span class="tag">Your Group</span></div>
  <div class="stats" style="margin-top:14px;grid-template-columns:repeat(3,1fr)"><div class="stat"><div class="stat-icon">⭐</div><small>Total XP</small><strong>${groupTotal()}</strong></div><div class="stat"><div class="stat-icon">👥</div><small>Members</small><strong>${members.length}</strong></div><div class="stat"><div class="stat-icon">🏆</div><small>Group Rank</small><strong>#1</strong></div></div></div>
  <div class="section-title">Members</div><div class="card">${members.map((m,i)=>`<div class="member ${m.you?"you":""}"><b>${i+1}</b><div style="display:flex;align-items:center;gap:8px"><i class="avatar"${m.you&&m.avatar?` style="background-image:url('${m.avatar}');background-size:cover;background-position:center"`:""}>${m.you&&m.avatar?"":(m.you?"🙂":"👤")}</i><span>${esc(m.name)}${m.you?" (You)":""}</span></div><b>${m.xp||0} XP</b><span>🔥 ${m.streak||0}d</span></div>`).join("")}</div>
  <button class="tool" style="width:100%;margin-top:13px;text-align:left" onclick="renderGlobalLeaderboard()">
    <div class="big">🌍</div>
    <b>Global Leaderboard</b>
    <span>See how real households rank worldwide by total XP</span>
  </button>
  </main>${bottomNav("group")}`;
}

/* ---------- profile/reset ---------- */
function renderProfile(){
  const m=me();
  document.getElementById("app").innerHTML=`${topbar("Profile","renderHome()")}
  <main class="content"><button class="link" onclick="renderHome()">← Back to Home</button><h1 class="page-title" style="margin-top:10px">My Profile</h1><p class="page-sub">Your household identity and local prototype settings.</p>
  <div class="card" style="text-align:center">

  <div class="card"><div class="row"><div><h3 style="margin:0 0 4px">📲 Install Household Hub</h3><p class="muted" style="margin:0">Add it to your home screen for a full-screen app experience and offline access.</p></div></div><button class="primary" style="margin-top:12px" onclick="installApp()">${isStandalone()?"Already Installed":"Install App"}</button></div>
  <div class="card"><h3 style="margin-top:0">Prototype controls</h3><p class="muted">Reset removes this local household and returns the app to the empty first-open screen.</p><button class="secondary" onclick="if(confirm('Reset the prototype and remove all local data?'))resetApp()">Reset & Start Again</button></div>
  </main>${bottomNav("profile")}`;

/* ---------- PWA: install prompt + service worker ---------- */
let deferredInstallPrompt=null;
function isStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone===true;
}
window.addEventListener("beforeinstallprompt",(e)=>{
  e.preventDefault();
  deferredInstallPrompt=e;
});
window.addEventListener("appinstalled",()=>{
  deferredInstallPrompt=null;
  toast("Household Hub installed!");
});
function installApp(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(()=>{deferredInstallPrompt=null;});
  }else if(isStandalone()){
    toast("Already installed on this device");
  }else{
    toast("Use your browser menu \u2192 \"Add to Home Screen\" or \"Install App\"");
  }
}
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{/* offline-support unavailable, app still works online */});
  });
}

load();
applyTheme();
if(state.household) renderHome(); else renderOnboarding();
</script>
